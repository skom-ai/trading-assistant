# =====================================================================
# File: redis.conf
# Description: Local-dev Redis configuration for Valtide session/cache/
#              rate-limit/idempotency state. All keys are TTL-bound and
#              ephemeral by design (see specs/arch/data/redis-keyspace.md).
# Notes: Bind to all interfaces INSIDE the container network only; the
#        service is not published to the host in production compose.
#        No secrets are stored in Redis. Persistence kept minimal.
# =====================================================================

# Network — container-internal; docker-compose controls host exposure.
bind 0.0.0.0
protected-mode no
port 6379

# Memory policy — cache-friendly eviction; session/idempotency keys carry
# their own TTLs so volatile-lru only trims cache-aside entries first.
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistence — light AOF off, minimal RDB (state is ephemeral by design).
save ""
appendonly no

# Safety — disable the most dangerous commands in shared/local envs.
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# Logging — notice level is enough for local debugging.
loglevel notice
